<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>DofLab 室內場景庫 Viewer</title>
<style>
  :root{--bg:#10151c;--panel:#1a222d;--ink:#e6edf5;--mute:#8b98a8;--acc:#4cc2ff}
  *{box-sizing:border-box}
  body{margin:0;height:100vh;display:flex;background:var(--bg);color:var(--ink);font:14px/1.5 "Noto Sans TC","Microsoft JhengHei",system-ui,sans-serif}
  #side{width:280px;min-width:240px;background:var(--panel);display:flex;flex-direction:column;border-right:1px solid #2b3645}
  #side h1{font-size:16px;margin:0;padding:14px 16px;border-bottom:1px solid #2b3645}
  #list{flex:1;overflow:auto;padding:8px}
  .item{padding:8px 10px;border-radius:6px;cursor:pointer;margin-bottom:4px}
  .item:hover{background:#243040}.item.on{background:#2a4258;outline:1px solid var(--acc)}
  .item small{display:block;color:var(--mute)}
  #opts{padding:12px 16px;border-top:1px solid #2b3645}
  #opts label{display:flex;gap:8px;align-items:center;margin:4px 0;cursor:pointer}
  #opts p{margin:8px 0 0;color:var(--mute);font-size:12px}
  #main{flex:1;position:relative;min-width:0}
  #main>canvas{display:block;width:100%;height:100%}
  #info{position:absolute;left:12px;top:10px;background:#000a;padding:6px 10px;border-radius:6px;font-size:13px;pointer-events:none}
  #hint{position:absolute;left:12px;bottom:10px;color:var(--mute);font-size:12px;pointer-events:none}
  #err{position:absolute;inset:auto 12px 30px 12px;color:#ff9b9b;font-size:13px}
  @media (max-width:640px){#side{width:170px;min-width:150px}}
</style>
</head>
<body>
<div id="side">
  <h1>🏢 室內場景庫</h1>
  <div id="list"></div>
  <div id="opts">
    <label><input type="checkbox" id="oAnch" checked> 顯示錨點</label>
    <label><input type="checkbox" id="oNav"> 顯示導航網格</label>
    <label><input type="checkbox" id="oCeil" checked> 隱藏天花板</label>
    <label><input type="checkbox" id="oDemo" checked> Demo 人物模式</label>
    <p>連接 AI 後端：網址加 <code>?ws=ws://localhost:8765</code>（見 tools/mock_agent_server.py）</p>
  </div>
</div>
<div id="main"><div id="info">載入中…</div><div id="hint">點人物：跟隨・雙擊：肩後視角・Esc：返回全景</div><div id="err"></div></div>

<script type="importmap">
{"imports":{
 "three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
 "three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"}}
</script>
<script type="module">
import * as THREE from 'three';
import {GLTFLoader} from 'three/addons/loaders/GLTFLoader.js';
import {OrbitControls} from 'three/addons/controls/OrbitControls.js';
import {createWorld, B2T} from './engine.js';

const $ = id => document.getElementById(id);
const main = $('main');
const renderer = new THREE.WebGLRenderer({antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
main.prepend(renderer.domElement);
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x10151c);
const camera = new THREE.PerspectiveCamera(45,1,0.1,500);
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
scene.add(new THREE.HemisphereLight(0xffffff,0x445566,1.1));
const sun = new THREE.DirectionalLight(0xffffff,1.6); sun.position.set(-8,16,10); scene.add(sun);

const world = createWorld({scene, camera, controls, dom: renderer.domElement, container: main});
const loader = new GLTFLoader();
let catalog=[], group=null, navObj=null, anchorGroup=null, ceilObjs=[], meta=null, token=0;
const ANCH_COL = {SEAT:0xe03c3c, STAND:0x3c78e0, POI:0xe69600, STATUS:0xa03cc8, DOOR:0x00c060};

function resize(){ const w=main.clientWidth,h=main.clientHeight; renderer.setSize(w,h,false); camera.aspect=w/h; camera.updateProjectionMatrix(); }
new ResizeObserver(resize).observe(main); resize();

function clearCurrent(){
  [group,anchorGroup,navObj].forEach(o=>o&&scene.remove(o));
  world.setScene(null);
  group=anchorGroup=navObj=null; ceilObjs=[];
}

async function loadScene(entry){
  const my=++token; clearCurrent();
  $('info').textContent='載入 '+entry.name_zh+' …'; $('err').textContent='';
  const base = '../scenes/'+entry.dir+'/';
  try{
    const m = await (await fetch(base+'scene.json')).json();
    const gltf = await loader.loadAsync(base+'scene.glb');
    const navg = await loader.loadAsync(base+'navmesh.glb');
    if(my!==token) return;
    meta=m; group = gltf.scene; scene.add(group);
    group.traverse(o=>{ if(o.isMesh && /^(Ceiling|LightPanel)/.test(o.name)) ceilObjs.push(o); });
    navObj = navg.scene;
    navObj.traverse(o=>{ if(o.isMesh){ o.material=new THREE.MeshBasicMaterial({color:0x22e07a,transparent:true,opacity:0.45,side:THREE.DoubleSide,depthWrite:false}); o.position.y+=0.02; }});
    scene.add(navObj);
    buildAnchors();
    world.setScene(meta, navObj);
    const [W,D]=meta.size_m;
    controls.target.set(W/2,0.5,-D/2);
    camera.position.set(W/2-W*0.55, Math.max(W,D)*0.85, -D/2+D*0.95);
    controls.update();
    $('info').textContent = `${meta.id} ${meta.name_zh}｜${W}×${D} m｜門 ${meta.doors.length}｜錨點 ${meta.anchors.length}`;
    applyOpts();
    if($('oDemo').checked) world.startDemo();
  }catch(e){ $('err').textContent='載入失敗：'+e; console.error(e); }
}

function buildAnchors(){
  anchorGroup = new THREE.Group();
  for(const a of meta.anchors){
    const col=ANCH_COL[a.type]||0xffffff, g=new THREE.Group();
    g.add(new THREE.Mesh(new THREE.SphereGeometry(0.09,10,8),new THREE.MeshBasicMaterial({color:col})));
    if(a.type!=='STATUS'){
      const yaw=a.yaw_deg*Math.PI/180;
      g.add(new THREE.ArrowHelper(new THREE.Vector3(-Math.sin(yaw),0,-Math.cos(yaw)),new THREE.Vector3(),0.5,col,0.15,0.1));
    }
    g.position.copy(B2T(a.position)); g.position.y+= a.type==='STATUS'?0:0.1;
    anchorGroup.add(g);
  }
  for(const d of meta.doors){
    const ns=d.wall==='S'||d.wall==='N';
    const m=new THREE.Mesh(new THREE.BoxGeometry(ns?d.width_m:0.25,0.08,ns?0.25:d.width_m),new THREE.MeshBasicMaterial({color:ANCH_COL.DOOR}));
    m.position.copy(B2T(d.position)); m.position.y=0.05; anchorGroup.add(m);
  }
  scene.add(anchorGroup);
}

function applyOpts(){
  if(anchorGroup) anchorGroup.visible=$('oAnch').checked;
  if(navObj) navObj.visible=$('oNav').checked;
  ceilObjs.forEach(o=>o.visible=!$('oCeil').checked);
}
['oAnch','oNav','oCeil'].forEach(id=>$(id).addEventListener('change',applyOpts));
$('oDemo').addEventListener('change',()=>{ $('oDemo').checked?world.startDemo():world.stopDemo(); });

function select(entry,el){
  document.querySelectorAll('.item').forEach(e=>e.classList.remove('on')); el.classList.add('on');
  location.hash=entry.dir;
  loadScene(entry);
}
async function init(){
  try{ const c=await (await fetch('../catalog.json')).json(); catalog=c.scenes||c; }
  catch(e){ $('err').textContent='無法讀取 catalog.json：'+e; return; }
  const list=$('list');
  catalog.forEach(e=>{
    const el=document.createElement('div'); el.className='item';
    el.innerHTML=`<b>${e.id} ${e.name_zh}</b><small>${e.name_en}｜${e.size_m[0]}×${e.size_m[1]} m｜${e.category}</small>`;
    el.onclick=()=>select(e,el); list.appendChild(el); e._el=el;
  });
  const wsUrl=new URLSearchParams(location.search).get('ws');
  if(wsUrl){ $('oDemo').checked=false; world.connect(wsUrl); }
  const h=location.hash.slice(1); const first=catalog.find(e=>e.dir===h)||catalog[0];
  if(first) select(first,first._el);
}
const clock=new THREE.Clock();
renderer.setAnimationLoop(()=>{ const dt=Math.min(clock.getDelta(),0.1); world.update(dt); controls.update(); renderer.render(scene,camera); });
window.__viewer={get meta(){return meta}, world, camera, controls};
init();
</script>
</body>
</html>
